<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
    <link rel="icon" href="images/Calculator.png" type="image/x-icon" />
  </head>
  <body>
    <button id="zero">0</button>
    <button class="button" id="one">1</button>
    <button class="button"id="two">2</button>
    <button class="button"id="three">3</button>
    <button class="button"id="four">4</button>
    <button class="button"id="five">5</button>
    <button class="button"id="six">6</button>
    <button class="button"id="seven">7</button>
    <button class="button"id="eight">8</button>
    <button class="button"id="nine">9</button>
    <button class="orange"id="divide">/</button>
    <button class="orange"id="multiply">*</button>
    <button class="orange"id="subtract">-</button>
    <button class="orange"id="add">+</button>
    <button class="orange"id="equals">=</button>
    <button class="button"id="point">.</button>
    <section id="screen"></section>
    <button class="button"id="clear">AC</button>
    <button class="button"id="percent">%</button>
    <button class="button"id="negative">+/-</button>
    <script src="script.js"></script>
  </body>
</html>
